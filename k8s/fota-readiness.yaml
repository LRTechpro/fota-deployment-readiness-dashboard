apiVersion: apps/v1
kind: Deployment
metadata:
  name: fota-readiness
  labels:
    app: fota-readiness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fota-readiness
  template:
    metadata:
      labels:
        app: fota-readiness
    spec:
      containers:
        - name: dashboard
          image: fota-readiness-dashboard:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: temporary-files
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fota-readiness-service
spec:
  selector:
    app: fota-readiness
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
